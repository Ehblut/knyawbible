<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add a friend on Knyaw Bible</title><meta property="og:site_name" content="Knyaw Bible"><meta property="og:title" content="Add me as a friend on Knyaw Bible"><meta property="og:description" content="Open this link in Knyaw Bible to add me as a friend."><link rel="stylesheet" href="style.css"></head>
<body>
<nav><a href="index.html">Support</a><a href="privacy.html">Privacy Policy</a></nav>
<h1 id="who">Add a friend on Knyaw Bible</h1>
<p class="muted" id="username"></p>
<p id="bio"></p>
<p><a id="open" href="#" style="display:inline-block;padding:10px 18px;border-radius:999px;background:#0a84ff;color:#fff;text-decoration:none;font-weight:600">Open in Knyaw Bible</a></p>
<p class="muted">Do not have the app yet? Install Knyaw Bible, then open this link again to add them as a friend. Questions: <a href="mailto:knyawbible@gmail.com">knyawbible@gmail.com</a>.</p>
<script>
  // The profile is in the link's query (u, n, b, e, p): the page shows it and hands the same query to the app.
  var q = new URLSearchParams(location.search);
  var u = q.get("u") || "";
  if (q.get("n")) document.getElementById("who").textContent = q.get("n") + " invites you to Knyaw Bible";
  if (u) document.getElementById("username").textContent = "@" + u;
  if (q.get("b")) document.getElementById("bio").textContent = q.get("b");
  var app = "knyawbible://friend?" + q.toString();
  document.getElementById("open").href = app;
  if (u) setTimeout(function () { location.href = app; }, 300);
</script>
</body></html>
